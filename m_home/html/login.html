<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>优医问诊</title>
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../iconfonts/iconfont.css" />
    <link
      href="http://cdn.remixicon.com/releases/v1.2.0/remixicon.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="//at.alicdn.com/t/c/font_5021197_8s8q4ze8g96.css"
    />
  </head>
  <body>
    <header class="navTop">
      <div class="navTopLeft">
        <a href="../html/index.html">
          <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path
            d="M10.8284 12.0007L15.7782 16.9504L14.364 18.3646L8 12.0007L14.364 5.63672L15.7782 7.05093L10.8284 12.0007Z"
          ></path>
        </svg>
        </a>
      </div>
      <div class="navTopRight">
        <a href="#">注册</a>
      </div>
    </header>
    <div class="loginTitle">
      <h2>密码登录</h2>
      <a href="#"
        >手机验证码登录<img
          src="../RemixIcon_Svg_v4.7.0/icons/Arrows/arrow-right-s-line.svg"
          alt=""
      /></a>
    </div>

    <form action="" class="loginForm" autocomplete="off">
      <div class="row">
        <input type="tel" placeholder="请输入手机号" />
      </div>
      <div class="row">
        <input type="password" placeholder="请输入密码" />
        <img src="../img/eye-off.svg" />
      </div>
      <div class="row">
        <i class="iconfont icon-radio"></i>
        我已同意<a href="#"> 用户协议 </a>及 <a href="#"> 隐私政策 </a>
      </div>
      <button type="submit" class="loginBtn">登录</button>
      <p class="forgetPwd"><a href="#">忘记密码？</a></p>
    </form>

    <div class="loginFooter">
      <div class="footerTop">
        <p>第三方登录</p>
      </div>
      <div class="footerBottom">
        <a href="#"><img src="../img/qq.svg" alt="" /></a>
      </div>
    </div>

    <script src="../js/flexible.js"></script>
  </body>
</html>
