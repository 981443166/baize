<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 数据类型 js为弱类型语言 必须在运行时才确定变量的数据类型 java为强类型语言 必须在编译时就确定变量的数据类型
        // 1. 数值类型 number
        let a = 10;
        console.log(a);
        console.log(typeof a);
        // 2. 字符串类型 string
        let b = "hello";
        console.log(b);
        console.log(typeof b);
        // 3. 布尔类型 boolean
        let c = true;
        console.log(c);
        console.log(typeof c);
        // 4. 数组类型 array
        let d = [1,2,3,4,5];
        console.log(d);
        console.log(typeof d);
        // 5. 对象类型 object
        let e = {
            name:'张三',
            age:18,
            sex:'男'
        }
        console.log(e);
        console.log(typeof e);
        // 6. 空类型 null
        let f = null;
        console.log(f);
        console.log(typeof f);
    </script>
</body>
</html>
