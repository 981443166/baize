<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        // 交互2个变量案例
        let a = 10
        let b = 20
        let temp = 0
        console.log("交互前,a=" + a + ",b=" + b);
        // 交互2个变量
        temp = a
        a = b
        b = temp
        console.log("交互后,a=" + a + ",b=" + b);
    </script>
</body>
</html>
