<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 函数返回值，函数为什么要有返回值
        // 1. 函数内部不输出结果，而是将计算结果返回给调用者
        // 2. 函数可以将数据传递给其他函数使用
        function add(a, b) {
            return a + b;
        }

        let num1 = prompt('请输入第一个数字');
        let num2 = prompt('请输入第二个数字');
        // 有返回值的写法
        let result = add(Number(num1), Number(num2));
        console.log(result);
    </script>
</body>
</html>
