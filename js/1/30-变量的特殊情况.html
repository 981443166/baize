<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        function fn(){
            num = 10; //当成全局变量处理，如果外部有let或者var声明，就会数据出错
        }
        fn();
        console.log(num);

        function fn2(a,b){
            console.log(a+b);
        }
        fn2(10,20);
        console.log(a);//a是fn2函数的参数，只能在函数内部使用
    </script>
</body>
</html>
