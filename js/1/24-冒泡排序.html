        // console.log(data);

        let data2 = [3,2,1,4,5];
        for(let i = 0;i < data2.length - 1;i++){
            for(let j = 0;j < data2.length - 1 - i;j++){
                if(data2[j] > data2[j + 1]){
                    let temp = data2[j];
                    data2[j] = data2[j + 1];
                    data2[j + 1] = temp;
                }
            }
        }
        console.log(data2);

        // 升序
        data2.sort(function(a,b){
            return a - b;
        })
        // data2.sort((a,b) => a - b);
        // console.log(data2);
        // 降序
        data2.sort((a,b) => b - a);
        console.log(data2);
    </script>
