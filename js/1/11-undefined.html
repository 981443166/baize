<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        // undefined 未定义类型 表示变量未被赋值
        let a;
        console.log(a);
        console.log(typeof a);
        // 未定义类型的变量不能被使用
        console.log(a + 10); // NaN
        console.log(undefined + 10); // NaN
        console.log(null + 10); // 10
    </script>
</body>
</html>
