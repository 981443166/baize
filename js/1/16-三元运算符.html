<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 三元运算符
        // 语法： 条件 ? 表达式1 : 表达式2
        // 解释：如果条件为true，则执行表达式1，否则执行表达式2
        let age = 18;
        let result = age >= 18 ? "成年人" : "未成年人";
        console.log(result);


        // 案列：用户输入两个数，比较大小
        let num1 = parseFloat(prompt("请输入第一个数"));
        let num2 = parseFloat(prompt("请输入第二个数"));
        let max = num1 > num2 ? num1 : num2;
        console.log("较大的数是：" + max);

        // 案列：用户输入一个数字，如果数字小于10，则前面进行补零
        let num = parseInt(prompt("请输入一个数字"));
        let result2 = num < 10 ? "0" + num : num;
        console.log(result2);
    </script>
</body>
</html>
