<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 函数命名规则：小驼峰命名法，第一个单词尽量以动词开头
        function sayHello(){
            //函数体：函数要执行的代码
            console.log("hello world");
        }
        // 调用函数，可以重复调用
        sayHello();
        sayHello();
    </script>
</body>
</html>
