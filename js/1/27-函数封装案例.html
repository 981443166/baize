        // 封装一个函数数组，求数组之间的和
        function getArraySum(arr){
            let sum = 0;
            for(let i = 0;i < arr.length;i++){
                sum += arr[i];
            }
            alert(sum);
        }

        let arr = [1,2,3,4,5];

        getArraySum(arr);
