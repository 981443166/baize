<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        // continue：跳过当前循环，继续下一次循环
        let i = 1;
        while(i <= 5){
            if(i === 3){
                i++;
                // break;
                continue;
            }
            console.log(`我要吃${i}个包子`);
            i++;
        }
    </script>
</body>
</html>
