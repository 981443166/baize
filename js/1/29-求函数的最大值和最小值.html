<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        function getMax(a, b) {
            return a > b ? a : b;
        }

        function getMin(a, b) {
            return a < b ? a : b;
        }

        function getArrayMax(arr){
            let max = arr[0]
            for(let i = 1;i<arr.length;i++){
                max = getMax(max,arr[i]);
            }        
            return max;
        }
        
        function getArrayMin(arr){
            let min = arr[0]
            for(let i = 1;i<arr.length;i++){
                min = getMin(min,arr[i]);
            }
            return min;
        }

        console.log(getMax(10, 20));
        console.log(getMin(10, 20));
        console.log(getArrayMax([1, 2, 3, 4, 5]));
        console.log(getArrayMin([1, 2, 3, 4, 5]));
    </script>
</body>
</html>
