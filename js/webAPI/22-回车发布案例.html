<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新拟态风格评论框</title>
    <link
      rel="stylesheet"
      href="https://font.sec.miui.com/font/css?family=MiSans:400,700:MiSans"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: MiSans;
      }

      body {
        background-color: #e6e6e6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .comment-container {
        width: 100%;
        max-width: 600px;
        background-color: #e6e6e6;
        border-radius: 20px;
        padding: 30px;
        box-shadow:
          8px 8px 16px #c9c9c9,
          -8px -8px 16px #ffffff;
      }

      .comment-title {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
        font-size: 24px;
        font-weight: 600;
      }

      .comment-box {
        position: relative;
        margin-bottom: 20px;
      }

      .comment-textarea {
        width: 100%;
        min-height: 150px;
        padding: 20px;
        border: none;
        border-radius: 15px;
        background-color: #e6e6e6;
        box-shadow:
          inset 4px 4px 8px #c9c9c9,
          inset -4px -4px 8px #ffffff;
        font-size: 16px;
        color: #333;
        resize: vertical;
        outline: none;
        transition: all 0.3s ease;
      }

      .comment-textarea::placeholder {
        color: #999;
      }

      .comment-textarea:focus {
        box-shadow:
          inset 6px 6px 12px #c9c9c9,
          inset -6px -6px 12px #ffffff;
      }

      .comment-footer {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .comment-footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .comment-stats {
        color: #666;
        font-size: 14px;
      }

      .comment-length {
        padding: 6px 12px;
        border-radius: 10px;
        background-color: #e6e6e6;
        color: #666;
        font-size: 14px;
        box-shadow:
          3px 3px 6px #c9c9c9,
          -3px -3px 6px #ffffff;
      }

      .comment-button {
        padding: 12px 24px;
        border: none;
        border-radius: 12px;
        background-color: #e6e6e6;
        color: #333;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        box-shadow:
          5px 5px 10px #c9c9c9,
          -5px -5px 10px #ffffff;
        transition: all 0.3s ease;
      }

      .comment-button:hover {
        box-shadow:
          3px 3px 6px #c9c9c9,
          -3px -3px 6px #ffffff;
        transform: translateY(2px);
      }

      .comment-button:active {
        box-shadow:
          inset 4px 4px 8px #c9c9c9,
          inset -4px -4px 8px #ffffff;
      }

      @media (max-width: 768px) {
        .comment-container {
          padding: 20px;
        }

        .comment-textarea {
          min-height: 120px;
          padding: 15px;
        }

        .comment-button {
          padding: 10px 20px;
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="comment-container">
      <h2 class="comment-title">发表评论</h2>
      <div class="comment-box">
        <textarea
          class="comment-textarea"
          placeholder="分享你的想法..."
        ></textarea>
      </div>
      <div class="comment-footer">
        <div class="comment-footer-top">
          <div class="comment-stats">
            <span>支持 Markdown 格式</span>
          </div>
          <div class="comment-length">
            <span class="comment-length-total">字数统计: 0</span>
          </div>
        </div>
        <button class="comment-button">提交评论</button>
      </div>
    </div>


    <script src="../jquery.js"></script>
    <script>
        

        // 通过jQuery实现
        
    </script>
  </body>
</html>
