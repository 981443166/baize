<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .slider{
            width: 800px;
            height: 500px;
            margin: 0 auto;
            position: relative;
        }
        .slider-wrapper{
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .slider-wrapper img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slider-footer{
            width: 100%;
            height: 80px;
            background-color: rgba(0,0,0,0.5);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .slider-footer p{
            font-size: 20px;
        }

        .slider-indicator{
            display: flex;
            list-style: none;
        }
        .slider-indicator li{
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #6d6d6d;
            margin: 0 5px;
        }
        .slider-indicator li.active{
            width: 12px;
            height: 12px;
            background-color: #fff;
        }

        .toggle{
            display: flex;
        }
        .toggle button{
            width: 40px;
            height: 40px;
            border-radius: 20%;
            border: none;
            background-color: rgba(255,255,255,0.5);
            color: #fff;
            font-size: 20px;
            margin: 0 10px;
            transition: all 0.2s ease-in-out;
        }

        .toggle button:hover{
            background-color: #dfdfdf;
            color: #6d6d6d;
        }


    </style>
</head>
<body>
    <div class="slider">
        <div class="slider-wrapper">
            <img src="../webAPI/img/1.jpg" alt="">
        </div>
        <div class="slider-footer">
            <p>123</p>
            <ul class="slider-indicator">
                <li></li>
                <li></li>
                <li></li>
                <li></li>
            </ul>
            <div class="toggle">
                <button class="prev">&lt;</button>
                <button class="next">&gt;</button>
            </div>
        </div>
    </div>


    <script>
        const sliderData = [
            {url: '../webAPI/img/1.jpg',title: '画师总结',color: '#42f38c'},
            {url: '../webAPI/img/2.jpg',title: '嘟嘟脸',color: '#f3428c'},
            {url: '../webAPI/img/3.jpg',title: '盗月社',color: '#428cf3'},
            {url: '../webAPI/img/4.jpg',title: '731',color: '#f38c42'},
        ]

        const random = parseInt(Math.random() * sliderData.length)
        console.log(sliderData[random])
        //更换轮播图
        const sliderWrapperImg = document.querySelector('.slider-wrapper img')
        //第一种 sliderWrapper.innerHTML = `<img src="${sliderData[random].url}">，设置innerHTML会覆盖之前的内容
        //第二种 sliderWrapperImg.src = sliderData[random].url,这种方式需要在查找img元素后才能设置src
        sliderWrapperImg.src = sliderData[random].url
        //更换标题
        const sliderFooterP = document.querySelector('.slider-footer p')
        sliderFooterP.innerHTML = sliderData[random].title
        //更滑背景颜色
        const sliderFooter = document.querySelector('.slider-footer')
        sliderFooter.style.background = sliderData[random].color
        //更换指示器颜色
        const sliderIndicator = document.querySelector(`.slider-indicator li:nth-child(${random + 1})`)
        sliderIndicator.classList.add('active')
    </script>
</body>
</html>
