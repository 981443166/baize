<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ad{
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 300px;
            width: 300px;
            height: 200px;
            background-color: #ccc;
        }
        .ad h2{
            text-align: center;
        }
        .ad p{
            text-align: center;
        }
        .ad:hover{
            background-color: #999;
        }
        .ad:hover h2{
            color: #fff;
        }
        .ad:hover p{
            color: #fff;
        }
        .ad button{
            position: absolute;
            top: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    <div class="ad">
        <h2>广告</h2>
        <p>这是一条广告</p>
        <button>X</button>
    </div>

    <script>
        const btn = document.querySelector(".ad")
        btn.addEventListener("click",() => {
            // btn.remove() 删除掉.ad的盒子
            btn.style.display = "none" // 隐藏掉.ad的盒子
        })
    </script>
</body>
</html>
