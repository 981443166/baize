<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .dad{
            width: 200px;
            height: 200px;
            background-color: pink;
        }
        .son{
            width: 100px;
            height: 100px;
            background-color: red;
        }
    </style>
</head>
<body>
    <button id="btn">点击我</button>

    <div class="dad">
        <div class="son"></div>
    </div>

    <script>
        const btn = document.querySelector('#btn');
        const dad = document.querySelector('.dad');
        const son = document.querySelector('.son');
        // btn.addEventListener('click',function(){
        //     alert('点击了btn');
        //     // 解绑事件
        //     // btn.onclick = null;
        // })

        // 解绑事件 必须使用函数名，不能使用匿名函数
        function clickBtn(){
            alert('点击了btn');
        }
        btn.addEventListener('click',clickBtn);
        // 解绑事件
        btn.removeEventListener('click',clickBtn);


        //mouseover和mouseout事件会冒泡
        dad.addEventListener('mouseover',function(){
            console.log('鼠标进入了dad');
        })
        dad.addEventListener('mouseout',function(){
            console.log('鼠标离开了dad');
        })
        // mouseenter和mouseleave事件不会冒泡
        dad.addEventListener('mouseenter',function(){
            console.log('鼠标进入了dad');
        })
        dad.addEventListener('mouseleave',function(){
            console.log('鼠标离开了dad');
        })
    </script>
</body>
</html>
