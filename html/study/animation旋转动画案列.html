<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: #000;
        }
        .box{
            display: flex;
            justify-content: center;
            margin-top: 25%;
        }
        @keyframes rotate {
            100% {
                transform: rotate(360deg);
            }
        }
        .box img{
            animation: rotate 1s linear infinite;
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="../img/buttonOutterCircle.webp" alt="">
    </div>
</body>
</html>
