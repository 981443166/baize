<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,body{
            width: 100%;
            height: 100%;
        }
        .box{
            width: 548px;
            height: 513px;
            background: url(../img/精灵图.png) no-repeat left/13700px 513px;
            animation: steps 1s steps(25) infinite;
        }
        @keyframes steps {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: -13700px 0;
            }
        }
    </style>
</head>
<body>
    <div class="box">
    </div>
</body>
</html>
