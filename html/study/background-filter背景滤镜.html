<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&display=swap");
    </style>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      ul,
      li {
        list-style: none;
      }
      a {
        text-decoration: none;
      }
      body {
        background: url(../img/彭于晏.png) no-repeat center center/cover;
      }
      .header {
        width: 100%;
        height: 60px;
        background: transparent;
        backdrop-filter: blur(8px);
        filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.5));
      }
      .navbar{
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .navbar ul {
        display: flex;
        font-size: 14px;
        line-height: 60px;
        margin-left: 15px;

      }
      .navbar ul li{
        width: 70px;
        text-align: center;
      }
      .navbar ul li a {
        color: #fff;
        font-family: "Libre Bodoni", serif;
      }
      .navbar ul li:nth-child(1) a{
        color: #000;
        background: #fff;
        padding: 5px 10px;
        border-radius: 15px;
      }
      .navbar ul li a:hover{
        color: #000;
        background: #fff;
        padding: 5px 10px;
        border-radius: 15px;
        transition: all 0.2s ease-in-out;
      }
      .navbar button{
        padding: 8px 18px;
        border-radius: 50px;
        border: 1px solid #fff;
        background: transparent;
        color: #fff;
        font-family: "Libre Bodoni", serif;
        margin-right: 15px;
      }
      .navbar button:hover{
        background: #fff;
        color: #000;
        transition: all 0.2s ease-in-out;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="navbar">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
        <button>Login</button>
      </div>
    </div>
  </body>
</html>
