<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --awidth: 150px;
      }
      body {
        background: #fbc2eb;
      }
      a {
        text-decoration: none;
      }
      .nav {
        margin: 100px auto;
        position: relative;
        width: calc(var(--awidth) * 5);
        height: 50px;
        background-color: #007bff;
        line-height: 50px;
        font-size: 0px;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      }
      .nav a {
        display: inline-block;
        position: relative;
        z-index: 1;
        width: var(--awidth);
        height: 100%;
        line-height: 50px;
        color: #fff;
        font-size: 16px;
        transition: all 0.3s ease-in-out;
      }
      .nav .animation {
        position: absolute;
        height: 100%;
        top: 0;
        left: 0;
        width: var(--awidth);
        z-index: 0;
        background-color: #ff0000;
        border-radius: 10px;
        transition: all 0.3s ease-in-out;
      }
      /* 动画效果 */
      /* 当我的鼠标悬停在第一个导航项上时 ~ 代表选择同级别后面的事物*/
      .nav a:nth-child(1):hover ~ .animation {
        left: 0;
      }
      /* 当我的鼠标悬停在第二个导航项上时 */
      .nav a:nth-child(2):hover ~ .animation {
        left: var(--awidth);
        background-color: #69ff96;
      }
      /* 当我的鼠标悬停在第三个导航项上时 */
      .nav a:nth-child(3):hover ~ .animation {
        left: calc(var(--awidth) * 2);
        background-color: #ff9669;
      }
      /* 当我的鼠标悬停在第四个导航项上时 */
      .nav a:nth-child(4):hover ~ .animation {
        left: calc(var(--awidth) * 3);
        background-color: #6996ff;
      }
      /* 当我的鼠标悬停在第五个导航项上时 */
      .nav a:nth-child(5):hover ~ .animation {
        left: calc(var(--awidth) * 4);
        background-color: #ff6996;
      }
    </style>
  </head>
  <body>
    <div class="nav">
      <a href="#">首页</a>
      <a href="#">关于我们</a>
      <a href="#">产品中心</a>
      <a href="#">联系我们</a>
      <a href="#">加入我们</a>
      <div class="animation"></div>
    </div>
  </body>
</html>
