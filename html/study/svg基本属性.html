        /* 修改svg描边宽度为10px */

        /* stroke-linejoin: round; */
        /* 虚线 */
        stroke-dasharray: 2834;
        stroke-dashoffset: 2834;
      }
      svg:hover {
        animation: heart 0.6s linear infinite;
      }
      @keyframes move {
        0% {
          stroke-dasharray: 0 600;
        }
        100% {
          stroke-dasharray: 600 0;
        }
      }
      @keyframes heart {
        0% {
          stroke-dasharray: 2834;
        }
        100% {
          stroke-dashoffset: 0;
        }
      }
    </style>
