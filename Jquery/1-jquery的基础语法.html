<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="btnA" class="a">a</button>
    <button class="b">b</button>

    <script src="./jquery.js"></script>
    <script>
      // $(document).ready() 文档加载完成后执行，
      // 文档加载完成包括：文档内容加载完成，图片加载完成，css加载完成，js加载完成
      // jquery 提供了一个方法 $(document).ready() 来解决这个问题
      //第一种
      // $(document).ready(() => {
        
      // });
      //第二种
      // $(() => {
        
      // });

      //DOM对象
        // 通过js获取的元素对象（document）
      //Jquery对象
        // 通过jquery获取的包装集对象（$()）  

      //dom
        let btn = document.getElementById('btnA');
        console.log(btn);
        let btns = document.getElementsByTagName('button');
        console.log(btns);
      //dom取空值
        let btns2 = document.getElementById('c');
        console.log(btns2); //HTMLCollection [] 空集合  

      console.log("===========分割线============");
        
      //jquery是返回的集合ce.fc.init(),就是$()
        let btnJquery = $('#btnA');
        console.log(btnJquery);
        let btnJquery1 = $('button');
        console.log(btnJquery1);
      //jquery取空值
        let btnJquery2 = $('#c');
        console.log(btnJquery2);
      //dom对象转换为jquery对象
        let btnJquery3 = $(btn);
        console.log(btnJquery3);  
      //jquery对象转换为dom对象
        let btnDom = btnJquery1[0];
        console.log(btnDom);  
      
    </script>
  </body>
</html>
