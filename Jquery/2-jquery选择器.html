<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .active{
            color: green;
            font-size: 50px;
        }
    </style>
</head>
<body>
    <div id="box1">
        <span>q</span>
        <span>w</span>
        <span>e</span>
    </div>
    <p>2</p>
    <p>2</p>
    <p>2</p>
    <div class="box2">3</div>
    <span>span</span>
    <span>span2</span>    

    <input type="text">
    <input type="text" value="text">
    <input type="password" value="password">
    <input type="radio" value="radio">


    <script src="./jquery.js"></script>

    <script>
        // 1.基本选择器
        // 1.1 id选择器
        $('#box1').addClass('red');
        // 1.2 标签选择器
        $('p').css('color', 'blue');
        // 1.3 class选择器
        $('.box2').text('hello jquery');
        // 1.4 *选择器
        $('*').css('border', '1px solid red');
        // 1.5 并集选择器
        $('div,p').css('background', 'yellow');


        // 2.层级选择器
        // 2.1 后代选择器
        $('#box1 span').addClass('active');
        // 2.2 子元素选择器
        $('#box1 > span').css('background', 'red');
        // 2.3 相邻兄弟选择器,相邻的下一个兄弟元素
        let a = $('#box1 + p');
        console.log(a);
        a.css('font-size', '30px');
        a.css('font-weight', '600');
        // 2.4 通用兄弟选择器,选择指定元素后面的所有兄弟元素
        $('#box1 ~ span').css('color', 'pink');


        // 3.表单选择器
        // 3.1 :input 选择所有表单元素
        $(':input').css('border', '3px solid green');
        // 3.2 :text 选择所有文本框
        $(':text').css('background', 'pink');
        // 3.3 :password 选择所有密码框
        $(':password').css('background', 'lightblue');
        // 3.4 :radio 选择所有单选按钮
        $(':radio').css('color', 'red');
        // 3.5 :checkbox 选择所有复选框
        $(':checkbox').css('color', 'yellow');
        // 3.6 :submit 选择所有提交按钮
        $(':submit').css('color', 'purple');
        // 3.7 :button 选择所有按钮
        $(':button').css('color', 'orange');
        // 3.8 :image 选择所有图像域
        $(':image').css('color', 'pink');
        // 3.9 :reset 选择所有重置按钮
        $(':reset').css('color', 'pink');
        // 3.10 :file 选择所有文件域
        $(':file').css('color', 'purple');
    </script>
</body>
</html>
