<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>指尖魔法 - 3D粒子交互</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: sans-serif;
      }

      canvas {
        display: block;
      }

      #fullscreen-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 10px 20px;
        background: rgba(255, 255, 255, 0.15);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        cursor: pointer;
        z-index: 100;
        backdrop-filter: blur(10px);
        transition: all 0.3s;
        font-size: 14px;
      }

      #fullscreen-btn:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      video {
        display: none;
      }

      #loading-hint {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: rgba(255, 255, 255, 0.5);
        pointer-events: none;
      }

      #status {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.6);
        font-size: 14px;
        z-index: 100;
        text-align: center;
        background: rgba(0, 0, 0, 0.3);
        padding: 6px 14px;
        border-radius: 20px;
      }
    </style>
  </head>

  <body>
    <button id="fullscreen-btn">进入全屏</button>
    <div id="loading-hint">正在加载魔法资源...</div>
    <div id="status">初始化中...</div>
    <video id="video" playsinline></video>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { FontLoader } from "three/addons/loaders/FontLoader.js";
      import { TextGeometry } from "three/addons/geometries/TextGeometry.js";

      /** --- 核心参数配置 --- **/
      let scene, camera, renderer, particles, font;
      const particleCount = 8000; // 粒子总数
      const positions = new Float32Array(particleCount * 3);
      const targetPositions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      let balloons = [],
        flowers = [];
      let currentGesture = -1; // 状态记录
      let isInitialized = false;
      let wandMesh = null;
      let sparkles = [];

      const video = document.getElementById("video");
      const btn = document.getElementById("fullscreen-btn");

      /** --- 初始化 Three.js 场景 --- **/
      function initScene() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(
          60,
          window.innerWidth / window.innerHeight,
          1,
          1000
        );
        camera.position.set(0, 0, 80);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // 粒子几何体
        const geometry = new THREE.BufferGeometry();
        const randomRange = 200;
        for (let i = 0; i < particleCount * 3; i++) {
          positions[i] = (Math.random() - 0.5) * randomRange;
          targetPositions[i] = positions[i];
          colors[i] = 1.0;
        }
        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(positions, 3)
        );
        geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
          size: 0.7,
          vertexColors: true,
          transparent: true,
          opacity: 0.8,
          blending: THREE.AdditiveBlending,
          sizeAttenuation: true,
        });

        particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // 灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xff69b4, 1500, 200);
        pointLight.position.set(0, 50, 50);
        scene.add(pointLight);

        window.addEventListener("resize", onWindowResize);
        btn.onclick = () => document.documentElement.requestFullscreen();
      }

      /** --- 手势识别逻辑 (MediaPipe) --- **/
      async function initMediaPipe() {
        const hands = new Hands({
          locateFile: (file) =>
            `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
        });

        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: 0.8,
          minTrackingConfidence: 0.8,
        });

        hands.onResults(onResults);

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 1280, height: 720 },
        });
        video.srcObject = stream;
        video.play();

        async function detect() {
          await hands.send({ image: video });
          requestAnimationFrame(detect);
        }
        detect();
        document.getElementById("loading-hint").style.display = "none";
        document.getElementById("status").textContent = "等待手势输入...";
      }

      function onResults(results) {
        if (
          results.multiHandLandmarks &&
          results.multiHandLandmarks.length > 0
        ) {
          const landmarks = results.multiHandLandmarks[0];
          const fingerCount = countFingers(landmarks);
          const p = lmToScene(landmarks[8]);
          updateWand(p.x, p.y);
          if (sparkles.length < 200 && fingerCount > 0) {
            spawnSparkle(p.x, p.y, 0);
          }
          updateInteraction(fingerCount);
          updateStatus(fingerCount);
        } else {
          updateStatus(0);
          if (wandMesh) {
            scene.remove(wandMesh);
            wandMesh = null;
          }
        }
      }

      function countFingers(lm) {
        let count = 0;
        // 简单的指尖高度判断逻辑
        if (lm[8].y < lm[6].y) count++; // 食指
        if (lm[12].y < lm[10].y) count++; // 中指
        if (lm[16].y < lm[14].y) count++; // 无名指
        if (lm[20].y < lm[18].y) count++; // 小指
        // 拇指判断 (根据横向距离)
        if (Math.abs(lm[4].x - lm[2].x) > 0.05) count++;
        return count;
      }

      /** --- 交互变换逻辑 --- **/
      function updateInteraction(count) {
        if (count === 0 && currentGesture !== 0) {
          resetToStandby();
          currentGesture = 0;
        } else if (count >= 1 && count <= 3 && currentGesture !== count) {
          morphToText(count.toString());
          currentGesture = count;
          clearExtras();
        } else if (count === 4 && currentGesture !== 4) {
          morphToChristmasTree();
          currentGesture = 4;
        } else if (count === 5 && currentGesture !== 5) {
          morphToText("I LOVE U"); // 字体兼容性考虑，使用LOVE代替❤️
          triggerCelebration();
          currentGesture = 5;
        }
      }

      function morphToChristmasTree() {
        const treePoints = [];
        for (let y = -25; y <= 18; y += 1.2) {
          const r = (25 - (y + 25)) * 0.6 + 2;
          const n = Math.max(20, Math.floor(r * 8));
          for (let i = 0; i < n; i++) {
            const a = (i / n) * Math.PI * 2;
            const x = Math.cos(a) * r;
            const z = Math.sin(a) * r;
            treePoints.push([x, y, z]);
          }
        }
        for (let y = -28; y <= -23; y += 1.2) {
          treePoints.push([0, y, 0]);
          treePoints.push([1.2, y, 0.6]);
          treePoints.push([-1.2, y, -0.6]);
        }
        const star = [];
        const starY = 22;
        const starR = 3.5;
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2;
          star.push([Math.cos(a) * starR, starY, Math.sin(a) * starR]);
          const a2 = a + Math.PI / 5;
          star.push([
            Math.cos(a2) * (starR * 0.4),
            starY,
            Math.sin(a2) * (starR * 0.4),
          ]);
        }
        star.forEach((p) => treePoints.push(p));
        for (let i = 0; i < particleCount; i++) {
          const idx = i % treePoints.length;
          const [x, y, z] = treePoints[idx];
          const angle = Math.random() * Math.PI * 2;
          const radius = Math.random() * 15;
          const ex = Math.cos(angle) * radius;
          const ez = Math.sin(angle) * radius;
          const i3 = i * 3;
          targetPositions[i3] = x + ex;
          targetPositions[i3 + 1] = y + Math.random() * 8 - 4;
          targetPositions[i3 + 2] = z + ez;
        }
        const color = new THREE.Color(0x33ff77);
        for (let i = 0; i < particleCount; i++) {
          colors[i * 3] = color.r;
          colors[i * 3 + 1] = color.g;
          colors[i * 3 + 2] = color.b;
        }
        particles.geometry.attributes.color.needsUpdate = true;
        document.getElementById("status").textContent = "圣诞树特效";
      }

      function lmToScene(lm) {
        const sx = (0.5 - lm.x) * 80;
        const sy = (0.5 - lm.y) * 60;
        return { x: sx, y: sy };
      }

      function updateWand(x, y) {
        if (!wandMesh) {
          const g = new THREE.SphereGeometry(1.2, 16, 16);
          const m = new THREE.MeshPhongMaterial({ color: 0xffff00 });
          wandMesh = new THREE.Mesh(g, m);
          scene.add(wandMesh);
        }
        wandMesh.position.set(x, y, 0);
      }

      function spawnSparkle(x, y, z) {
        const g = new THREE.SphereGeometry(0.8, 12, 12);
        const m = new THREE.MeshPhongMaterial({
          color: 0x88ccff,
          transparent: true,
          opacity: 1,
        });
        const s = new THREE.Mesh(g, m);
        s.position.set(x, y, z);
        s.userData = {
          life: 1.0,
          decay: 0.015 + Math.random() * 0.03,
          vx: (Math.random() - 0.5) * 1.2,
          vy: (Math.random() - 0.5) * 1.2,
          vz: (Math.random() - 0.5) * 1.2,
        };
        scene.add(s);
        sparkles.push(s);
      }

      function updateStatus(count) {
        const el = document.getElementById("status");
        if (count === 0) el.textContent = "等待手势输入...";
        else el.textContent = "检测到手指数: " + count;
      }
      function morphToText(text) {
        if (!font) return;
        const textGeo = new TextGeometry(text, {
          font: font,
          size: text.length > 1 ? 12 : 25,
          height: 2,
          curveSegments: 4,
        });
        textGeo.center();

        const posAttr = textGeo.attributes.position;
        const count = posAttr.count;

        for (let i = 0; i < particleCount; i++) {
          const i3 = i * 3;
          if (i < count) {
            targetPositions[i3] = posAttr.array[i3];
            targetPositions[i3 + 1] = posAttr.array[i3 + 1];
            targetPositions[i3 + 2] = posAttr.array[i3 + 2];
          } else {
            // 多余粒子在文字周围形成星团
            const angle = Math.random() * Math.PI * 2;
            const dist = 30 + Math.random() * 20;
            targetPositions[i3] = Math.cos(angle) * dist;
            targetPositions[i3 + 1] = Math.sin(angle) * dist;
            targetPositions[i3 + 2] = (Math.random() - 0.5) * 10;
          }
        }

        // 颜色变换
        const color = new THREE.Color(text.length > 1 ? 0xff4466 : 0x00ffff);
        for (let i = 0; i < particleCount; i++) {
          colors[i * 3] = color.r;
          colors[i * 3 + 1] = color.g;
          colors[i * 3 + 2] = color.b;
        }
        particles.geometry.attributes.color.needsUpdate = true;
      }

      function triggerCelebration() {
        clearExtras();
        // 升起气球
        for (let i = 0; i < 40; i++) {
          const balloon = new THREE.Mesh(
            new THREE.SphereGeometry(1.5, 12, 12),
            new THREE.MeshPhongMaterial({
              color: Math.random() * 0xffffff,
              shininess: 100,
            })
          );
          balloon.position.set(
            (Math.random() - 0.5) * 120,
            -60 - Math.random() * 50,
            (Math.random() - 0.5) * 40
          );
          scene.add(balloon);
          balloons.push({ mesh: balloon, speed: 0.2 + Math.random() * 0.3 });
        }
        // 散落花朵 (简单平面替代)
        for (let i = 0; i < 50; i++) {
          const flower = new THREE.Mesh(
            new THREE.CircleGeometry(0.8, 5),
            new THREE.MeshBasicMaterial({
              color: 0xffb7c5,
              side: THREE.DoubleSide,
            })
          );
          flower.position.set(
            (Math.random() - 0.5) * 150,
            -60 - Math.random() * 50,
            (Math.random() - 0.5) * 40
          );
          flower.rotation.set(
            Math.random() * Math.PI,
            Math.random() * Math.PI,
            0
          );
          scene.add(flower);
          flowers.push({
            mesh: flower,
            speed: 0.15 + Math.random() * 0.2,
            rot: Math.random() * 0.02,
          });
        }
      }

      function resetToStandby() {
        for (let i = 0; i < particleCount * 3; i++) {
          targetPositions[i] = (Math.random() - 0.5) * 200;
          colors[i] = 1.0;
        }
        particles.geometry.attributes.color.needsUpdate = true;
        clearExtras();
      }

      function clearExtras() {
        balloons.forEach((b) => scene.remove(b.mesh));
        flowers.forEach((f) => scene.remove(f.mesh));
        balloons = [];
        flowers = [];
        if (wandMesh) {
          scene.remove(wandMesh);
          wandMesh = null;
        }
        for (let i = sparkles.length - 1; i >= 0; i--) {
          scene.remove(sparkles[i]);
        }
        sparkles = [];
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);

        // 粒子平滑插值
        const posAttr = particles.geometry.attributes.position;
        for (let i = 0; i < particleCount * 3; i++) {
          posAttr.array[i] += (targetPositions[i] - posAttr.array[i]) * 0.08;
        }
        posAttr.needsUpdate = true;

        // 气球与花朵动画
        balloons.forEach((b) => {
          b.mesh.position.y += b.speed;
          b.mesh.position.x +=
            Math.sin(Date.now() * 0.001 + b.mesh.position.y) * 0.05;
        });
        flowers.forEach((f) => {
          f.mesh.position.y += f.speed;
          f.mesh.rotation.z += f.rot;
        });
        for (let i = sparkles.length - 1; i >= 0; i--) {
          const s = sparkles[i];
          const d = s.userData;
          s.position.x += d.vx;
          s.position.y += d.vy;
          s.position.z += d.vz;
          d.life -= d.decay;
          s.material.opacity = Math.max(0, d.life);
          if (d.life <= 0) {
            scene.remove(s);
            sparkles.splice(i, 1);
          }
        }

        renderer.render(scene, camera);
      }

      /** --- 资源加载与启动 --- **/
      const mpScript = document.createElement("script");
      mpScript.src = "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js";
      mpScript.onload = () => {
        const loader = new FontLoader();
        // 使用 Three.js 官方提供的字体 JSON
        loader.load(
          "https://threejs.org/examples/fonts/helvetiker_bold.typeface.json",
          (f) => {
            font = f;
            initScene();
            initMediaPipe();
            animate();
          }
        );
      };
      document.head.appendChild(mpScript);
    </script>
  </body>
</html>
