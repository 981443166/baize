<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D手势粒子交互系统 - 手指数量识别</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }

        /* 隐藏的视频元素，用于MediaPipe处理 */
        #input_video { position: absolute; top: -1000px; left: -1000px; transform: scaleX(-1); }

        /* UI 面板 */
        #ui-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
            z-index: 10;
        }

        h2 { margin: 0 0 15px 0; font-size: 18px; font-weight: 500; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }

        .control-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 12px; color: #aaa; text-transform: uppercase; }

        /* 按钮样式 */
        .shape-btn {
            display: inline-block;
            width: 48%;
            padding: 8px 0;
            margin: 0 1% 8px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            text-align: center;
        }
        .shape-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .shape-btn.active { background: #00d2ff; color: #000; font-weight: bold; border-color: #00d2ff; }

        /* 颜色选择器 */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 35px;
            border-radius: 6px;
            cursor: pointer;
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; }

        /* 全屏按钮 */
        #fullscreen-btn {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        #fullscreen-btn:hover { background: rgba(255, 255, 255, 0.1); }

        /* 状态指示器 */
        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00d2ff;
            font-size: 14px;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 20px;
            pointer-events: none;
        }

        /* 手指数量显示 */
        #finger-count-display {
            position: absolute;
            top: 70px;
            left: 20px;
            background: rgba(0, 210, 255, 0.2);
            border: 2px solid #00d2ff;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        #finger-count-number {
            font-size: 36px;
            font-weight: bold;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        #finger-count-label {
            font-size: 10px;
            color: #aaa;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* 手指效果说明 */
        #finger-effects-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 12px;
            max-width: 300px;
            pointer-events: none;
        }

        .effect-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            padding: 5px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .effect-item.active {
            background: rgba(0, 210, 255, 0.2);
            border-left: 3px solid #00d2ff;
        }

        .effect-count {
            width: 30px;
            font-weight: bold;
            color: #00d2ff;
        }

        .effect-name {
            flex: 1;
            color: #ddd;
        }

        /* 摄像头预览小窗 */
        #webcam-preview {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
            opacity: 0.7;
            transform: scaleX(-1);
        }

        /* 引导提示 */
        #guide-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        #guide-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .guide-content {
            text-align: center;
            color: #fff;
            max-width: 500px;
            padding: 40px;
        }

        .guide-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #00d2ff;
        }

        .guide-text {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #ddd;
        }

        .guide-button {
            padding: 15px 40px;
            background: #00d2ff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .guide-button:hover {
            background: #00b8e6;
            transform: scale(1.05);
        }

        /* 错误提示 */
        #error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.9);
            color: #fff;
            padding: 20px 40px;
            border-radius: 8px;
            font-size: 16px;
            z-index: 2000;
            display: none;
        }

        #error-message.show {
            display: block;
        }
    </style>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入 MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- 引导提示 -->
    <div id="guide-overlay">
        <div class="guide-content">
            <div class="guide-title">🎯 手势粒子交互系统</div>
            <div class="guide-text">
                <p>通过摄像头识别您的手势，根据伸出的手指数量切换不同的粒子效果！</p>
                <p><strong>使用说明：</strong></p>
                <ul style="text-align: left; color: #aaa;">
                    <li>伸出 1 根手指 → 爱心形状</li>
                    <li>伸出 2 根手指 → 花朵形状</li>
                    <li>伸出 3 根手指 → 土星形状</li>
                    <li>伸出 4 根手指 → 佛像形状</li>
                    <li>伸出 5 根手指 → 烟花球形状</li>
                    <li>握拳 → 随机形状</li>
                </ul>
            </div>
            <button class="guide-button" id="start-button">开始体验</button>
        </div>
    </div>

    <!-- 错误提示 -->
    <div id="error-message"></div>

    <div id="status">正在初始化摄像头与模型...</div>
    <div id="finger-count-display">
        <div id="finger-count-number">0</div>
        <div id="finger-count-label">手指数量</div>
    </div>
    <video id="input_video"></video>
    <canvas id="webcam-preview"></canvas>

    <div id="ui-container">
        <h2>粒子控制台</h2>

        <div class="control-group">
            <label>选择模型</label>
            <div id="shape-buttons">
                <div class="shape-btn active" data-shape="heart">爱心</div>
                <div class="shape-btn" data-shape="flower">花朵</div>
                <div class="shape-btn" data-shape="saturn">土星</div>
                <div class="shape-btn" data-shape="buddha">佛像(禅)</div>
                <div class="shape-btn" data-shape="firework">烟花球</div>
            </div>
        </div>

        <div class="control-group">
            <label>粒子颜色</label>
            <input type="color" id="color-picker" value="#00d2ff">
        </div>

        <button id="fullscreen-btn">⛶ 全屏模式</button>

        <div class="control-group" style="margin-top:20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top:10px;">
            <label>手势数据</label>
            <div style="font-size:12px; color:#ddd; display:flex; justify-content:space-between;">
                <span>状态: <span id="hand-state" style="color:#aaa;">未检测</span></span>
                <span>系数: <span id="scale-val" style="color:#00d2ff;">1.0</span></span>
            </div>
        </div>
    </div>

    <!-- 手指效果说明 -->
    <div id="finger-effects-info">
        <div class="effect-item" data-fingers="1">
            <span class="effect-count">1</span>
            <span class="effect-name">爱心</span>
        </div>
        <div class="effect-item" data-fingers="2">
            <span class="effect-count">2</span>
            <span class="effect-name">花朵</span>
        </div>
        <div class="effect-item" data-fingers="3">
            <span class="effect-count">3</span>
            <span class="effect-name">土星</span>
        </div>
        <div class="effect-item" data-fingers="4">
            <span class="effect-count">4</span>
            <span class="effect-name">佛像</span>
        </div>
        <div class="effect-item" data-fingers="5">
            <span class="effect-count">5</span>
            <span class="effect-name">烟花球</span>
        </div>
        <div class="effect-item" data-fingers="0">
            <span class="effect-count">0</span>
            <span class="effect-name">随机</span>
        </div>
    </div>

<script>
    // ================= 配置参数 =================
    const PARTICLE_COUNT = 25000;
    const PARTICLE_SIZE = 0.08;
    const TRANSITION_SPEED = 0.08; // 形状变换平滑度
    const HAND_SENSITIVITY = 0.15; // 手势响应平滑度

    // ================= 全局变量 =================
    let scene, camera, renderer, particles, geometry, material;
    let currentShape = 'heart';
    let targetPositions = []; // 存储目标形状的坐标
    let basePositions = [];   // 存储当前计算出的基础形状坐标（无缩放）
    let currentColor = new THREE.Color(0x00d2ff);

    // 手势控制变量
    let handScaleFactor = 1.0;  // 当前应用的缩放因子
    let targetHandScale = 1.0;  // 目标缩放因子（来自MediaPipe）
    let isHandDetected = false;
    
    // 手指数量识别相关变量
    let fingerCount = 0;          // 当前检测到的手指数量
    let lastFingerCount = -1;     // 上一次检测到的手指数量（用于检测变化）
    let fingerCountStable = 0;    // 手指数量稳定计数器（防止抖动）
    const STABLE_THRESHOLD = 5;    // 稳定阈值：连续检测到相同手指数量的帧数

    // UI 元素
    const statusEl = document.getElementById('status');
    const handStateEl = document.getElementById('hand-state');
    const scaleValEl = document.getElementById('scale-val');
    const fingerCountEl = document.getElementById('finger-count-number');
    const previewCanvas = document.getElementById('webcam-preview');
    const previewCtx = previewCanvas.getContext('2d');
    const guideOverlay = document.getElementById('guide-overlay');
    const errorMessage = document.getElementById('error-message');

    // ================= Three.js 初始化 =================
    function initThree() {
        scene = new THREE.Scene();
        // 添加一点雾效果增加深度感
        scene.fog = new THREE.FogExp2(0x050505, 0.02);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 25;
        camera.position.y = 2;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 创建粒子系统
        geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);

        // 初始位置随机分布
        for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 50;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        material = new THREE.PointsMaterial({
            color: currentColor,
            size: PARTICLE_SIZE,
            sizeAttenuation: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.8
        });

        particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // 初始化目标位置数组
        targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        basePositions = new Float32Array(PARTICLE_COUNT * 3);

        // 默认生成爱心
        generateShape('heart');

        // 监听窗口大小变化
        window.addEventListener('resize', onWindowResize, false);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ================= 形状生成算法 =================
    // 使用数学公式生成不同形状的点云
    function getPointOnShape(type, idx, total) {
        const u = Math.random();
        const v = Math.random();
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);

        let x, y, z;

        switch (type) {
            case 'heart':
                // 3D Heart equation
                {
                    const t = theta;
                    const r = 0.5 + Math.random() * 0.5;
                    x = 16 * Math.pow(Math.sin(t), 3);
                    y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    z = (Math.random() - 0.5) * 8;
                    const scale = Math.cbrt(Math.random());
                    x *= scale; y *= scale; z *= scale;
                    x *= 0.5; y *= 0.5; z *= 0.5;
                }
                break;

            case 'flower':
                // 3D Rose / Flower shape
                {
                    const k = 3;
                    const r = 10 * Math.cos(k * theta) + 5;
                    const r_vol = r * Math.random();
                    x = r_vol * Math.cos(theta);
                    y = r_vol * Math.sin(theta);
                    z = (Math.random() - 0.5) * 5 * (1 - r_vol/15);
                    z += Math.cos(theta * k) * 2;
                }
                break;

            case 'saturn':
                // Sphere + Ring
                if (Math.random() > 0.4) {
                    const r = 6 * Math.cbrt(Math.random());
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                } else {
                    const rInner = 8;
                    const rOuter = 14;
                    const r = Math.sqrt(Math.random() * (rOuter*rOuter - rInner*rInner) + rInner*rInner);
                    x = r * Math.cos(theta);
                    z = r * Math.sin(theta);
                    y = (Math.random() - 0.5) * 0.5;
                    const tilt = 0.4;
                    const yt = y * Math.cos(tilt) - z * Math.sin(tilt);
                    const zt = y * Math.sin(tilt) + z * Math.cos(tilt);
                    y = yt; z = zt;
                }
                break;

            case 'buddha':
                // 简化的禅修人像
                {
                    const dice = Math.random();
                    if (dice < 0.15) {
                        const r = 2.5 * Math.cbrt(Math.random());
                        x = r * Math.sin(phi) * Math.cos(theta);
                        y = r * Math.sin(phi) * Math.sin(theta) + 6;
                        z = r * Math.cos(phi);
                    } else if (dice < 0.55) {
                        const r = 4.0 * Math.cbrt(Math.random());
                        x = r * Math.sin(phi) * Math.cos(theta);
                        y = (r * Math.sin(phi) * Math.sin(theta)) * 1.2;
                        z = r * Math.cos(phi) * 0.8;
                    } else {
                        const r = 5.5 * Math.sqrt(Math.random());
                        x = r * Math.cos(theta);
                        z = r * Math.sin(theta) * 0.7;
                        y = (Math.random() - 1) * 2 - 3;
                    }
                }
                break;

            case 'firework':
                // 爆炸形态
                {
                    const r = 15 * Math.cbrt(Math.random());
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                    if (Math.random() > 0.9) {
                        x *= 1.5; y *= 1.5; z *= 1.5;
                    }
                }
                break;

            default:
                x = y = z = 0;
        }

        return { x, y, z };
    }

    function generateShape(shapeType) {
        currentShape = shapeType;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const p = getPointOnShape(shapeType, i, PARTICLE_COUNT);
            basePositions[i * 3] = p.x;
            basePositions[i * 3 + 1] = p.y;
            basePositions[i * 3 + 2] = p.z;
        }
    }

    // ================= 手指数量识别算法 =================
    /**
     * 计算手指数量
     * @param {Array} landmarks - MediaPipe手部关键点数组
     * @returns {number} - 检测到的手指数量 (0-5)
     */
    function countFingers(landmarks) {
        let count = 0;
        
        // MediaPipe手部关键点索引
        // 0: 手腕
        // 4: 拇指尖, 2: 拇指根部
        // 8: 食指尖, 5: 食指根部
        // 12: 中指尖, 9: 中指根部
        // 16: 无名指尖, 13: 无名指根部
        // 20: 小指尖, 17: 小指根部
        
        // 食指：指尖(8)是否高于根部(5)
        if (landmarks[8].y < landmarks[5].y) count++;
        
        // 中指：指尖(12)是否高于根部(9)
        if (landmarks[12].y < landmarks[9].y) count++;
        
        // 无名指：指尖(16)是否高于根部(13)
        if (landmarks[16].y < landmarks[13].y) count++;
        
        // 小指：指尖(20)是否高于根部(17)
        if (landmarks[20].y < landmarks[17].y) count++;
        
        // 拇指：检查横向距离
        // 拇指的判断比较特殊，因为它主要是横向伸展
        const thumbTip = landmarks[4];
        const thumbBase = landmarks[2];
        const thumbDistance = Math.sqrt(
            Math.pow(thumbTip.x - thumbBase.x, 2) +
            Math.pow(thumbTip.y - thumbBase.y, 2)
        );
        
        // 如果拇指伸展距离超过阈值，则认为拇指伸出
        const thumbThreshold = 0.05;
        if (thumbDistance > thumbThreshold) count++;
        
        return count;
    }

    // ================= MediaPipe Hands 设置 =================
    const videoElement = document.getElementById('input_video');

    function onHandsResults(results) {
        // 更新预览 Canvas
        previewCanvas.width = videoElement.videoWidth;
        previewCanvas.height = videoElement.videoHeight;
        previewCtx.save();
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        previewCtx.drawImage(results.image, 0, 0, previewCanvas.width, previewCanvas.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            isHandDetected = true;
            statusEl.innerText = "已检测到手势";
            statusEl.style.color = "#00ff00";

            // 绘制骨架
            drawConnectors(previewCtx, results.multiHandLandmarks[0], HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});

            const landmarks = results.multiHandLandmarks[0];

            // 计算手指数量
            const currentFingerCount = countFingers(landmarks);
            
            // 稳定性检查：只有连续检测到相同手指数量才触发切换
            if (currentFingerCount === lastFingerCount) {
                fingerCountStable++;
            } else {
                fingerCountStable = 0;
                lastFingerCount = currentFingerCount;
            }
            
            // 如果稳定阈值达到，则更新手指数量
            if (fingerCountStable >= STABLE_THRESHOLD) {
                if (currentFingerCount !== fingerCount) {
                    fingerCount = currentFingerCount;
                    updateFingerCountDisplay(fingerCount);
                    switchShapeByFingerCount(fingerCount);
                }
            }

            // 计算手掌缩放（基于手掌张开程度）
            const wrist = landmarks[0];
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const indexBase = landmarks[5];

            const palmSize = Math.sqrt(
                Math.pow(indexBase.x - wrist.x, 2) +
                Math.pow(indexBase.y - wrist.y, 2)
            );

            const pinchDist = Math.sqrt(
                Math.pow(thumbTip.x - indexTip.x, 2) +
                Math.pow(thumbTip.y - indexTip.y, 2)
            );

            let openRatio = pinchDist / (palmSize || 0.1);
            const minRatio = 0.2;
            const maxRatio = 1.2;
            const minScale = 0.3;
            const maxScale = 2.5;

            let normalized = (openRatio - minRatio) / (maxRatio - minRatio);
            if (normalized < 0) normalized = 0;
            if (normalized > 1) normalized = 1;

            targetHandScale = minScale + normalized * (maxScale - minScale);

            handStateEl.innerText = normalized < 0.2 ? "合拢" : (normalized > 0.8 ? "张开" : "运动中");

        } else {
            isHandDetected = false;
            statusEl.innerText = "未检测到手势，请在摄像头前举起单手";
            statusEl.style.color = "#00d2ff";
            handStateEl.innerText = "未检测";
            targetHandScale = 1.0;
            
            // 重置手指数量显示
            fingerCount = 0;
            updateFingerCountDisplay(0);
        }
        previewCtx.restore();
    }

    // ================= 基于手指数量切换形状 =================
    /**
     * 根据手指数量切换粒子形状
     * @param {number} count - 手指数量 (0-5)
     */
    function switchShapeByFingerCount(count) {
        let newShape;
        
        switch (count) {
            case 1:
                newShape = 'heart';
                break;
            case 2:
                newShape = 'flower';
                break;
            case 3:
                newShape = 'saturn';
                break;
            case 4:
                newShape = 'buddha';
                break;
            case 5:
                newShape = 'firework';
                break;
            case 0:
            default:
                // 握拳时随机选择一个形状
                const shapes = ['heart', 'flower', 'saturn', 'buddha', 'firework'];
                newShape = shapes[Math.floor(Math.random() * shapes.length)];
                break;
        }
        
        if (newShape && newShape !== currentShape) {
            generateShape(newShape);
            updateUIButtons(newShape);
        }
    }

    // ================= UI 更新函数 =================
    function updateFingerCountDisplay(count) {
        fingerCountEl.innerText = count;
        
        // 更新手指效果说明的高亮状态
        document.querySelectorAll('.effect-item').forEach(item => {
            const fingers = parseInt(item.getAttribute('data-fingers'));
            if (fingers === count) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });
    }

    function updateUIButtons(shape) {
        document.querySelectorAll('.shape-btn').forEach(btn => {
            if (btn.getAttribute('data-shape') === shape) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    // ================= MediaPipe 初始化 =================
    const hands = new Hands({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    hands.onResults(onHandsResults);

    // ================= 摄像头初始化 =================
    async function initCamera() {
        try {
            // 请求摄像头权限
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    facingMode: 'user'
                },
                audio: false
            });

            videoElement.srcObject = stream;
            await videoElement.play();

            // 使用 CameraUtils 启动处理
            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 320,
                height: 240
            });

            await cameraUtils.start();
            
            // 隐藏引导提示
            guideOverlay.classList.add('hidden');
            
            statusEl.innerText = "摄像头已启动，请举起手";
            statusEl.style.color = "#00d2ff";

        } catch (error) {
            console.error('摄像头访问失败:', error);
            showError('摄像头访问失败，请检查权限设置或确保设备支持摄像头。');
            statusEl.innerText = "摄像头访问失败";
            statusEl.style.color = "red";
        }
    }

    function showError(message) {
        errorMessage.innerText = message;
        errorMessage.classList.add('show');
        
        // 5秒后自动隐藏错误提示
        setTimeout(() => {
            errorMessage.classList.remove('show');
        }, 5000);
    }

    // ================= UI 交互逻辑 =================
    // 开始按钮
    document.getElementById('start-button').addEventListener('click', () => {
        initCamera();
    });

    // 形状切换
    document.getElementById('shape-buttons').addEventListener('click', (e) => {
        if (e.target.classList.contains('shape-btn')) {
            const shape = e.target.getAttribute('data-shape');
            generateShape(shape);
            updateUIButtons(shape);
        }
    });

    // 颜色切换
    const colorPicker = document.getElementById('color-picker');
    colorPicker.addEventListener('input', (e) => {
        currentColor.set(e.target.value);
        if (material) material.color = currentColor;
    });

    // 全屏切换
    document.getElementById('fullscreen-btn').addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    });

    // ================= 动画循环 =================
    function animate() {
        requestAnimationFrame(animate);

        // 平滑手势缩放系数
        handScaleFactor += (targetHandScale - handScaleFactor) * HAND_SENSITIVITY;

        // 更新UI显示数值
        scaleValEl.innerText = handScaleFactor.toFixed(2);

        // 更新粒子位置
        const positions = particles.geometry.attributes.position.array;

        // 缓慢旋转整体
        particles.rotation.y += 0.002;
        if (currentShape === 'saturn') {
            particles.rotation.z = 0.3;
        } else {
            particles.rotation.z += (0 - particles.rotation.z) * 0.05;
        }

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const ix = i * 3;
            const iy = i * 3 + 1;
            const iz = i * 3 + 2;

            const bx = basePositions[ix];
            const by = basePositions[iy];
            const bz = basePositions[iz];

            const tx = bx * handScaleFactor;
            const ty = by * handScaleFactor;
            const tz = bz * handScaleFactor;

            positions[ix] += (tx - positions[ix]) * TRANSITION_SPEED;
            positions[iy] += (ty - positions[iy]) * TRANSITION_SPEED;
            positions[iz] += (tz - positions[iz]) * TRANSITION_SPEED;
        }

        particles.geometry.attributes.position.needsUpdate = true;

        renderer.render(scene, camera);
    }

    // ================= 启动 =================
    initThree();
    animate();

</script>
</body>
</html>
